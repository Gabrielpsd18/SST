<div class="trabajadores-import-container">
  <header class="page-header">
    <h2>Importar Trabajadores</h2>
    <p>Seleccione un archivo Excel con los datos de los trabajadores.</p>
  </header>

  <div class="import-card">
    <div class="file-upload">
      <label class="btn btn--primary" for="excelFile">Seleccionar archivo Excel</label>
      <input id="excelFile" type="file" accept=".xlsx,.xls" />
    </div>

    <div class="table-guide">
      <p>Ejemplo de formato de Excel:</p>
      <table>
        <thead>
          <tr>
            <th>Tipo documento</th>
            <th>Nº DNI</th>
            <th>Nombre completo</th>
            <th>Telefono</th>
            <th>Sede</th>
            <th>Cargo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>DNI</td>
            <td>12345678</td>
            <td>Nombres y Apellidos</td>
            <td>987654321</td>
            <td>Sede Centro</td>
            <td>Responsable</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
