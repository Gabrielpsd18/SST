<div class="login-container">
  <!-- Panel Izquierdo (Branding SST) -->
  <div class="login-brand">
    <div class="login-brand__content">
      <div class="login-brand__logo">
        <lucide-icon [img]="Shield"></lucide-icon>
      </div>
      <h1>Sistema SST</h1>
      <p>Gestión integral de Seguridad y Salud en el Trabajo.</p>
      
      <ul class="login-brand__features">
        <li>✓ Registro y control de trabajadores</li>
        <li>✓ Seguimiento de capacitaciones</li>
        <li>✓ Inspecciones y documentos</li>
      </ul>
    </div>
  </div>

  <!-- Panel Derecho (Formulario) -->
  <div class="login-form-wrapper">
    <div class="login-form-card">
      <div class="login-form-header">
        <h2>Bienvenido de nuevo</h2>
        <p>Ingresa tus credenciales para acceder</p>
      </div>

      <!-- Alerta de error -->
      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="login()" class="login-form">
        <div class="form-group">
          <label for="username">Correo electrónico</label>
          <input 
            type="email" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            placeholder="ejemplo@empresa.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading || !username || !password">
          <span *ngIf="!loading">Ingresar al Sistema</span>
          <span *ngIf="loading">Cargando...</span>
        </button>
      </form>
    </div>
  </div>
</div>
