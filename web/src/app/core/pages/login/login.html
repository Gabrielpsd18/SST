<div style="max-width: 300px; margin: 50px auto; font-family: sans-serif; text-align: center;">

  <h2>Iniciar Sesión</h2>
  <div *ngIf="errorMessage" style="
    background:#fdecea;
    color:#b71c1c;
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
  ">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="login()">

    <div style="margin-bottom: 10px;">
      <input type="email" [(ngModel)]="username" name="username" (input)="errorMessage=''" required
        style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 10px;">
      <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña"  (input)="errorMessage=''" required
        style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" [disabled]="loading" style="
        width:100%;
        padding:8px;
        cursor:pointer;
      ">

      {{ loading ? 'Ingresando...' : 'Ingresar' }}

    </button>

  </form>

</div>
