spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sst_db?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: public
    default-schema: public
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:rPqfXJ0ktpW2uY4nD5sV8zBcM7LhQaEe1Rg6UiNo9PmKxYsTzAvCxDfGhJkLmNpQr}
  expiration: ${JWT_EXPIRATION:3600000}

# Storage configuration (local by default). Set storage.type=s3 to enable S3/MinIO implementation.
storage:
  type: ${STORAGE_TYPE:local}

s3:
  endpoint: ${S3_ENDPOINT:}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:sst-bucket}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  path-style-access: ${S3_PATH_STYLE:true}